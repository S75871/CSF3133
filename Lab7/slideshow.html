<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automatic Slideshow</title>
    <link rel="stylesheet" href="slideshow.css">
</head>
<body>
    <div class="slideshow-container">
        <div class="slide">
            <img src="winter.jpg" alt="Image 1: Winter Scene">
        </div>
        <div class="slide">
            <img src="spring.jpg" alt="Image 2: Spring Blossoms">
        </div>
        <div class="slide">
            <img src="autumn.jpg" alt="Image 3: Autumn Leaves">
        </div>
    </div>
    
    <script src="slideshow.js"></script>
</body>
</html>
