<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collapsible Section</title>
    <link rel="stylesheet" href="collapsible.css">
</head>
<body>
    <div class="main-wrapper">
        <h2>Collapsible Example</h2>
        
        <div class="collapsible-group">
            <button class="collapsible">Section 1: Project Overview</button>
            <div class="content">
                <p>This section details the scope and initial requirements of the project. It uses a smooth CSS `max-height` transition for a better visual experience.</p>
            </div>
        </div>

        <div class="collapsible-group">
            <button class="collapsible">Section 2: Team Members</button>
            <div class="content">
                <p>Here, we list the key team members and their roles. Multiple groups can be opened or closed independently.</p>
            </div>
        </div>
        
    </div>
    <script src="collapsible.js"></script>
</body>
</html>
